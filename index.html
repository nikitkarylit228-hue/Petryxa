<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РасКВАДРАсь</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --accent: #00ff88;
    --accent-dark: #00cc6a;
    --bg: #0a0a0a;
    --panel: #141414;
    --panel-2: #1a1a1a;
    --border: #2a2a2a;
    --text: #eee;
    --muted: #888;
  }

  body {
    background:
      radial-gradient(ellipse at top left, rgba(0,255,136,0.07), transparent 45%),
      radial-gradient(ellipse at bottom right, rgba(0,150,255,0.06), transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 20px;
    min-height: 100vh;
  }

  .app {
    max-width: 1600px;
    margin: 0 auto;
    background: linear-gradient(180deg, #161616 0%, #101010 100%);
    border-radius: 24px;
    padding: 28px;
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 26px;
  }

  .logo {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, #00ff88 0%, #00b36b 50%, #007744 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,255,136,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    flex-shrink: 0;
    animation: logoPulse 4s ease-in-out infinite;
  }
  .logo::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent 60%);
    pointer-events: none;
  }
  .logo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 2px;
    width: 30px;
    height: 30px;
    position: relative;
    z-index: 1;
  }
  .logo-grid span {
    border-radius: 2px;
    background: #062b16;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2);
  }
  .logo-grid span.light { background: #eafff5; }
  .logo-grid span.mid   { background: #4dffb3; }
  .logo-grid span.dark  { background: #0a4a2a; }

  @keyframes logoPulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(0,255,136,0.35), inset 0 1px 0 rgba(255,255,255,0.4); }
    50%      { box-shadow: 0 8px 32px rgba(0,255,136,0.55), inset 0 1px 0 rgba(255,255,255,0.4); }
  }

  .header-text h1 {
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.5px;
    line-height: 1.2;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,255,136,0.4);
  }
  .header-text .sub {
    color: var(--muted);
    font-size: 13px;
    font-weight: 400;
    margin-top: 2px;
  }

  .section-title {
    color: var(--accent);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 0 0 10px 4px;
    opacity: 0.7;
    font-weight: 600;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid var(--border);
    margin-bottom: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .controls label {
    color: #aaa;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
  }

  .controls input[type="number"] {
    width: 80px;
    background: #0d0d0d;
    color: var(--accent);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 14px;
    font-weight: 600;
    transition: 0.2s;
    outline: none;
  }
  .controls input[type="number"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,255,136,0.12);
  }
  .controls input[type="range"] {
    width: 220px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .controls input[type="checkbox"] {
    accent-color: var(--accent);
    width: 17px;
    height: 17px;
    cursor: pointer;
  }
  .controls .value {
    color: var(--accent);
    font-weight: 700;
    min-width: 72px;
    font-size: 15px;
    text-shadow: 0 0 12px rgba(0,255,136,0.4);
  }

  .upload-zone {
    border: 2px dashed #2a2a2a;
    border-radius: 18px;
    padding: 28px;
    text-align: center;
    cursor: pointer;
    transition: 0.25s;
    background: linear-gradient(180deg, #0d0d0d 0%, #080808 100%);
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .upload-zone::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(0,255,136,0.08), transparent 70%);
    opacity: 0;
    transition: 0.3s;
  }
  .upload-zone:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0,255,136,0.1);
  }
  .upload-zone:hover::before { opacity: 1; }
  .upload-zone p { color: #bbb; font-size: 15px; font-weight: 500; position: relative; }
  .upload-zone small { color: #555; font-size: 12px; display: block; margin-top: 6px; position: relative; }
  .upload-zone input { display: none; }

  .canvas-wrapper {
    background: repeating-linear-gradient(45deg, #0c0c0c 0 10px, #0a0a0a 10px 20px);
    border-radius: 18px;
    padding: 0;
    border: 1px solid #1e1e1e;
    overflow: hidden;
    position: relative;
    height: 75vh;
    cursor: grab;
    user-select: none;
    box-shadow: inset 0 4px 20px rgba(0,0,0,0.6);
  }
  .canvas-wrapper.panning { cursor: grabbing; }
  .canvas-stage {
    position: absolute;
    left: 0; top: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  #pixelCanvas {
    display: block;
    background: #fff;
  }

  .info-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
    padding: 12px 16px;
    background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
    border-radius: 14px;
    border: 1px solid var(--border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .stat {
    color: #777;
    font-size: 12.5px;
    padding: 5px 10px;
    background: #0d0d0d;
    border-radius: 8px;
    border: 1px solid #1e1e1e;
    white-space: nowrap;
  }
  .stat .val {
    color: var(--accent);
    font-weight: 700;
    margin-left: 2px;
  }

  .btn-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-left: auto;
  }

  .btn {
    background: linear-gradient(180deg, #252525 0%, #1a1a1a 100%);
    border: 1px solid #2e2e2e;
    color: #ccc;
    padding: 9px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: 0.18s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover {
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #062b16;
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(0,255,136,0.3);
  }
  .btn:active { transform: translateY(0); }

  .btn-primary {
    background: linear-gradient(180deg, #004d33 0%, #003322 100%);
    border-color: #005544;
    color: #66ffbb;
  }
  .btn-print {
    background: linear-gradient(180deg, #003366 0%, #002244 100%);
    border-color: #004488;
    color: #66bbff;
  }
  .btn-danger {
    background: linear-gradient(180deg, #441111 0%, #330d0d 100%);
    border-color: #551515;
    color: #ff8888;
  }
  .btn-danger:hover {
    background: linear-gradient(180deg, #ff4444 0%, #cc2222 100%);
    color: #fff;
    border-color: #ff4444;
    box-shadow: 0 6px 18px rgba(255,68,68,0.3);
  }

  .status {
    color: #777;
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
    padding: 11px;
    background: #0d0d0d;
    border-radius: 12px;
    border: 1px solid #1a1a1a;
    transition: 0.2s;
  }

  .stats-panel {
    margin-top: 16px;
    padding: 16px 20px;
    background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
    border-radius: 14px;
    border: 1px solid var(--border);
    display: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .stats-compact {
    padding: 12px 14px;
    background: #0a0a0a;
    border-radius: 10px;
    border: 1px solid #1a1a1a;
    font-family: 'Consolas', 'Courier New', monospace;
    color: var(--accent);
    word-break: break-word;
    font-size: 14px;
    line-height: 1.8;
    letter-spacing: 0.5px;
  }
  .stats-compact .stat-item {
    display: inline-block;
    margin-right: 12px;
    white-space: nowrap;
  }
  .stats-compact .swatch {
    display: inline-block;
    width: 12px; height: 12px;
    border: 1px solid #555;
    border-radius: 2px;
    vertical-align: middle;
    margin-right: 4px;
  }
  .stats-compact .num {
    color: #fff;
    font-weight: 700;
  }
  .stats-compact .cnt {
    color: var(--accent);
    font-weight: 700;
  }

  /* ===== БЛОК ДЛЯ ПЕЧАТИ (скрыт на экране) ===== */
  .print-stats { display: none; }

  /* ===== ПЕЧАТЬ ===== */
  @media print {
    @page { size: auto; margin: 10mm; }

    html, body {
      margin: 0 !important; padding: 0 !important;
      background: #fff !important; color: #000 !important;
      width: 100% !important; height: auto !important;
    }

    /* Скрываем всё UI */
    .header, .controls, .upload-zone, .info-bar, .status,
    .section-title, .btn, .btn-group, .logo, .stats-panel {
      display: none !important;
    }

    .app {
      background: #fff !important; border: none !important;
      padding: 0 !important; margin: 0 !important;
      max-width: 100% !important; width: 100% !important;
      border-radius: 0 !important; box-shadow: none !important;
    }

    /* ===== СХЕМА ПО ЦЕНТРУ ===== */
    .canvas-wrapper {
      background: #fff !important; border: none !important;
      padding: 0 !important; margin: 0 auto 5mm auto !important;
      border-radius: 0 !important; overflow: visible !important;
      position: static !important; width: 100% !important;
      height: auto !important; max-width: 100% !important;
      max-height: none !important; display: block !important;
      box-shadow: none !important;
      text-align: center !important;
    }
    .canvas-stage {
      position: static !important; transform: none !important;
      display: block !important;
      width: auto !important;
      margin: 0 auto !important;
    }
    #pixelCanvas {
      display: block !important;
      margin: 0 auto !important;
      transform: none !important;
      width: auto !important;
      height: auto !important;
      max-width: 100% !important;
      max-height: 85vh !important;
      page-break-inside: avoid !important;
      page-break-after: avoid !important;
      border-radius: 0 !important;
      background: #fff !important;
    }

    /* ===== СТАТИСТИКА ПОД СХЕМОЙ (на том же листе) ===== */
    .print-stats {
      display: block !important;
      margin: 4mm auto 0 auto !important;
      padding: 3mm !important;
      max-width: 100% !important;
      page-break-inside: avoid !important;
      page-break-before: avoid !important;
      font-family: 'Consolas', 'Courier New', monospace !important;
      color: #000 !important;
      text-align: center !important;
      border-top: 1px solid #999 !important;
    }
    .print-stats .print-stats-line {
      font-size: 11pt !important;
      line-height: 1.6 !important;
      font-weight: 600 !important;
      color: #000 !important;
      word-break: break-word !important;
    }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">
      <div class="logo-grid">
        <span class="dark"></span><span class="mid"></span><span class="light"></span>
        <span class="mid"></span><span class="light"></span><span class="dark"></span>
        <span class="light"></span><span class="dark"></span><span class="mid"></span>
      </div>
    </div>
    <div class="header-text">
      <h1>РасКВАДРАсь</h1>
      <div class="sub">Из фото — в схему. Колёсико — зум, ЛКМ — тащить</div>
    </div>
  </div>

  <div class="section-title">⚙️ Настройки</div>
  <div class="controls">
    <label>📏 Размер пикселя:
      <input type="range" id="sizeSlider" min="1" max="50" step="1" value="10">
      <span class="value" id="sizeValue">10 мм</span>
    </label>
    <label>🔍 Детализация:
      <input type="number" id="detailInput" min="2" max="200" value="60">
    </label>
    <label>🎨 Оттенков:
      <input type="number" id="levelsInput" min="2" max="64" value="10">
    </label>
  </div>

  <div class="section-title">🔢 Нумерация</div>
  <div class="controls">
    <label><input type="checkbox" id="showTop" checked> Верхняя</label>
    <label>Шаг: <input type="number" id="stepTop" min="1" max="50" value="1"></label>
    <label><input type="checkbox" id="showLeft" checked> Левая</label>
    <label>Шаг: <input type="number" id="stepLeft" min="1" max="50" value="1"></label>
    <label><input type="checkbox" id="showDigits" checked> Цифры в ячейках</label>
  </div>

  <div class="upload-zone" id="uploadZone">
    <p>📁 Нажми или перетащи фото</p>
    <small>JPG, PNG, BMP, WEBP • колёсико — зум • зажми ЛКМ — тащить</small>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="canvas-wrapper" id="canvasWrapper">
    <div class="canvas-stage" id="canvasStage">
      <canvas id="pixelCanvas"></canvas>
    </div>
  </div>

  <!-- Статистика для ПЕЧАТИ (скрыта на экране, видна при Ctrl+P) -->
  <div class="print-stats" id="printStats">
    <div class="print-stats-line" id="printStatsLine"></div>
  </div>

  <div class="info-bar">
    <span class="stat">📐 <span class="val" id="sizeDisplay">0×0</span></span>
    <span class="stat">📏 1 = <span class="val" id="cellSizeDisplay">10</span> мм</span>
    <span class="stat">📦 <span class="val" id="totalSizeDisplay">0 × 0 см</span></span>
    <span class="stat">🎨 <span class="val" id="levelsDisplay">10</span></span>
    <span class="stat">🔍 <span class="val" id="detailDisplay">60</span></span>
    <div class="btn-group">
      <button class="btn btn-print" id="printBtn">🖨️ Печать</button>
      <button class="btn btn-primary" id="saveProjectBtn">💾 Сохранить проект</button>
      <button class="btn btn-primary" id="loadProjectBtn">📂 Открыть проект</button>
      <button class="btn" id="saveTxtBtn">📄 .txt</button>
      <button class="btn" id="savePngBtn">🖼️ .png</button>
      <button class="btn btn-danger" id="clearBtn">✕ Очистить</button>
    </div>
  </div>

  <div class="stats-panel" id="statsPanel">
    <div class="section-title">📊 Раскладка оттенков (номер-количество)</div>
    <div class="stats-compact" id="statsCompact"></div>
    <div style="margin-top:10px; color:#888; font-size:13px;" id="statsSummary"></div>
  </div>

  <div class="status" id="statusMsg">⚡ Загрузи фото → настрой всё под себя</div>

  <input type="file" id="projectInput" accept=".rkv,.json" style="display:none">
</div>

<script>
const $ = id => document.getElementById(id);
const fileInput = $('fileInput'), uploadZone = $('uploadZone');
const projectInput = $('projectInput');
const canvas = $('pixelCanvas'), ctx = canvas.getContext('2d');
const sizeSlider = $('sizeSlider'), sizeValue = $('sizeValue');
const detailInput = $('detailInput'), levelsInput = $('levelsInput');
const showTop = $('showTop'), stepTop = $('stepTop');
const showLeft = $('showLeft'), stepLeft = $('stepLeft');
const showDigits = $('showDigits');
const sizeDisplay = $('sizeDisplay'), cellSizeDisplay = $('cellSizeDisplay');
const totalSizeDisplay = $('totalSizeDisplay');
const levelsDisplay = $('levelsDisplay');
const detailDisplay = $('detailDisplay');
const statusMsg = $('statusMsg');
const printBtn = $('printBtn');
const saveProjectBtn = $('saveProjectBtn'), loadProjectBtn = $('loadProjectBtn');
const saveTxtBtn = $('saveTxtBtn'), savePngBtn = $('savePngBtn');
const clearBtn = $('clearBtn');
const statsPanel = $('statsPanel'), statsCompact = $('statsCompact'), statsSummary = $('statsSummary');
const canvasWrapper = $('canvasWrapper');
const canvasStage = $('canvasStage');
const printStatsLine = $('printStatsLine');

let currentMatrix = null;
let currentWidth = 0, currentHeight = 0;
let cellSizeMm = 10;
let LEVELS = 10;
let maxPixels = 60;
let originalImage = null;

let view = { scale: 1, tx: 0, ty: 0 };

// ===== ОБРАБОТЧИКИ =====
sizeSlider.addEventListener('input', () => {
  cellSizeMm = parseFloat(sizeSlider.value);
  sizeValue.textContent = cellSizeMm + ' мм';
  if (currentMatrix) { redraw(); resetView(); updateStats(); }
});

detailInput.addEventListener('change', () => {
  maxPixels = Math.max(2, Math.min(200, parseInt(detailInput.value) || 60));
  detailInput.value = maxPixels;
  detailDisplay.textContent = maxPixels;
  if (originalImage) processImage(originalImage);
});

levelsInput.addEventListener('change', () => {
  LEVELS = Math.max(2, Math.min(64, parseInt(levelsInput.value) || 10));
  levelsInput.value = LEVELS;
  levelsDisplay.textContent = LEVELS;
  if (originalImage) processImage(originalImage);
});

showTop.addEventListener('change', () => { if (currentMatrix) { redraw(); resetView(); } });
showLeft.addEventListener('change', () => { if (currentMatrix) { redraw(); resetView(); } });
showDigits.addEventListener('change', () => { if (currentMatrix) redraw(); });
stepTop.addEventListener('change', () => {
  stepTop.value = Math.max(1, Math.min(50, parseInt(stepTop.value) || 1));
  if (currentMatrix) redraw();
});
stepLeft.addEventListener('change', () => {
  stepLeft.value = Math.max(1, Math.min(50, parseInt(stepLeft.value) || 1));
  if (currentMatrix) redraw();
});

// ===== ЗАГРУЗКА ФОТО =====
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.style.borderColor = '#00ff88'; });
uploadZone.addEventListener('dragleave', () => uploadZone.style.borderColor = '#2a2a2a');
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.style.borderColor = '#2a2a2a';
  if (e.dataTransfer.files.length) {
    const f = e.dataTransfer.files[0];
    if (f.name.endsWith('.rkv') || f.name.endsWith('.json')) {
      loadProject(f);
    } else {
      fileInput.files = e.dataTransfer.files;
      handleFile(f);
    }
  }
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

function handleFile(file) {
  if (!file.type.startsWith('image/')) { statusMsg.textContent = '❌ Это не изображение'; return; }
  statusMsg.textContent = '⏳ Обработка...';
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => { originalImage = img; processImage(img); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function calculateGrid(img) {
  const ratio = img.width / img.height;
  let w, h;
  if (img.width >= img.height) {
    w = maxPixels;
    h = Math.max(1, Math.round(maxPixels / ratio));
  } else {
    h = maxPixels;
    w = Math.max(1, Math.round(maxPixels * ratio));
  }
  return { w, h };
}

function processImage(img) {
  const { w, h } = calculateGrid(img);

  let srcCanvas = document.createElement('canvas');
  srcCanvas.width  = img.width;
  srcCanvas.height = img.height;
  srcCanvas.getContext('2d').drawImage(img, 0, 0);

  let curW = img.width, curH = img.height;
  let curCanvas = srcCanvas;

  while (curW > w * 2 && curH > h * 2) {
    const nextW = Math.max(w, Math.floor(curW / 2));
    const nextH = Math.max(h, Math.floor(curH / 2));
    const tmp = document.createElement('canvas');
    tmp.width = nextW; tmp.height = nextH;
    const tmpCtx = tmp.getContext('2d');
    tmpCtx.imageSmoothingEnabled = true;
    tmpCtx.imageSmoothingQuality = 'high';
    tmpCtx.drawImage(curCanvas, 0, 0, nextW, nextH);
    curCanvas = tmp; curW = nextW; curH = nextH;
  }

  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = w; tempCanvas.height = h;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.imageSmoothingEnabled = true;
  tempCtx.imageSmoothingQuality = 'high';
  tempCtx.drawImage(curCanvas, 0, 0, w, h);

  const imageData = tempCtx.getImageData(0, 0, w, h);
  const data = imageData.data;
  const step = 255 / (LEVELS - 1);
  const matrix = [];

  for (let y = 0; y < h; y++) {
    const row = [];
    for (let x = 0; x < w; x++) {
      const idx = (y * w + x) * 4;
      const r = data[idx], g = data[idx + 1], b = data[idx + 2];
      const gray = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      let val = Math.round(gray / step);
      val = Math.min(Math.max(val, 0), LEVELS - 1);
      row.push(val);
    }
    matrix.push(row);
  }

  currentMatrix = matrix;
  currentWidth = w;
  currentHeight = h;
  redraw();
  resetView();
  updateStats();
  renderStats();

  const totalW = (w * cellSizeMm / 10).toFixed(1);
  const totalH = (h * cellSizeMm / 10).toFixed(1);
  statusMsg.textContent = `✅ Готово: ${w}×${h} • ${LEVELS} оттенков → ${totalW} × ${totalH} см`;
}

function redraw() {
  if (!currentMatrix) return;
  drawPixelMatrix(currentMatrix, currentWidth, currentHeight);
}

function autoStep(userStep, cellPx) {
  const base = Math.max(1, parseInt(userStep) || 1);
  if (base > 1) return base;
  if (cellPx >= 16) return 1;
  return Math.ceil(16 / cellPx);
}

function drawPixelMatrix(matrix, w, h) {
  const cellPx = Math.max(16, cellSizeMm * 2);
  const topPad = showTop.checked ? Math.max(30, cellPx + 8) : 6;
  const leftPad = showLeft.checked ? Math.max(36, cellPx + 16) : 6;
  const canvasW = leftPad + w * cellPx + 6;
  const canvasH = topPad + h * cellPx + 6;

  canvas.width = canvasW;
  canvas.height = canvasH;
  canvas.style.width = canvasW + 'px';
  canvas.style.height = canvasH + 'px';

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvasW, canvasH);

  const palette = [];
  for (let i = 0; i < LEVELS; i++) {
    const v = Math.round(i * (255 / (LEVELS - 1)));
    palette.push(`rgb(${v},${v},${v})`);
  }

  let fontSize = Math.floor(cellPx * 0.62);
  if (fontSize < 11) fontSize = 11;

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const val = matrix[y][x];
      const px = leftPad + x * cellPx;
      const py = topPad + y * cellPx;

      ctx.fillStyle = palette[val];
      ctx.fillRect(px, py, cellPx, cellPx);

      ctx.strokeStyle = 'rgba(120,120,120,0.5)';
      ctx.lineWidth = 1;
      ctx.strokeRect(px + 0.5, py + 0.5, cellPx - 1, cellPx - 1);

      if (showDigits.checked) {
        const brightness = val * (255 / (LEVELS - 1));
        const textColor = brightness < 128 ? '#ffffff' : '#000000';
        const outlineColor = brightness < 128 ? '#000000' : '#ffffff';
        const cx = px + cellPx / 2;
        const cy = py + cellPx / 2 + fontSize * 0.05;

        ctx.font = `900 ${fontSize}px 'Segoe UI', Arial, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.lineWidth = Math.max(2, fontSize * 0.16);
        ctx.strokeStyle = outlineColor;
        ctx.lineJoin = 'round';
        ctx.strokeText(val, cx, cy);

        ctx.fillStyle = textColor;
        ctx.fillText(val, cx, cy);
      }
    }
  }

  if (showTop.checked) {
    const step = autoStep(stepTop.value, cellPx);
    const topFontSize = Math.max(14, Math.floor(cellPx * 0.55));

    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(leftPad, 0, w * cellPx, topPad);

    ctx.font = `bold ${topFontSize}px 'Segoe UI', Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let x = 0; x < w; x++) {
      const num = x + 1;
      if (num % step !== 0 && num !== 1 && num !== w) continue;
      const px = leftPad + x * cellPx + cellPx / 2;
      const py = topPad / 2;

      const tw = ctx.measureText(num.toString()).width + 8;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(px - tw / 2, py - topFontSize * 0.75, tw, topFontSize * 1.5);

      ctx.fillStyle = '#000000';
      ctx.fillText(num.toString(), px, py);
    }

    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(leftPad, topPad);
    ctx.lineTo(leftPad + w * cellPx, topPad);
    ctx.stroke();
  }

  if (showLeft.checked) {
    const step = autoStep(stepLeft.value, cellPx);
    const leftFontSize = Math.max(14, Math.floor(cellPx * 0.55));

    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(0, topPad, leftPad, h * cellPx);

    ctx.font = `bold ${leftFontSize}px 'Segoe UI', Arial, sans-serif`;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';

    for (let y = 0; y < h; y++) {
      const num = y + 1;
      if (num % step !== 0 && num !== 1 && num !== h) continue;
      const px = leftPad - 8;
      const py = topPad + y * cellPx + cellPx / 2;

      const tw = ctx.measureText(num.toString()).width + 8;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(px - tw, py - leftFontSize * 0.75, tw, leftFontSize * 1.5);

      ctx.fillStyle = '#000000';
      ctx.fillText(num.toString(), px, py);
    }

    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(leftPad, topPad);
    ctx.lineTo(leftPad, topPad + h * cellPx);
    ctx.stroke();
  }

  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 3;
  ctx.strokeRect(leftPad, topPad, w * cellPx, h * cellPx);
}

function updateStats() {
  if (!currentMatrix) return;
  sizeDisplay.textContent = `${currentWidth}×${currentHeight}`;
  cellSizeDisplay.textContent = cellSizeMm;
  const totalW = (currentWidth * cellSizeMm / 10).toFixed(1);
  const totalH = (currentHeight * cellSizeMm / 10).toFixed(1);
  totalSizeDisplay.textContent = `${totalW} × ${totalH} см`;
  levelsDisplay.textContent = LEVELS;
  detailDisplay.textContent = maxPixels;
}

function countDigits(matrix) {
  const counts = new Array(LEVELS).fill(0);
  for (let y = 0; y < matrix.length; y++) {
    for (let x = 0; x < matrix[y].length; x++) {
      counts[matrix[y][x]]++;
    }
  }
  return counts;
}

// ===== СТАТИСТИКА =====
function renderStats() {
  if (!currentMatrix) { statsPanel.style.display = 'none'; return; }
  const counts = countDigits(currentMatrix);
  const total = currentWidth * currentHeight;

  const palette = [];
  for (let i = 0; i < LEVELS; i++) {
    const v = Math.round(i * (255 / (LEVELS - 1)));
    palette.push(`rgb(${v},${v},${v})`);
  }

  // Экранная версия — с квадратиками цветов
  let html = '';
  let usedLevels = 0;
  for (let i = 0; i < LEVELS; i++) {
    if (counts[i] === 0) continue;
    usedLevels++;
    html += `<span class="stat-item">
      <span class="swatch" style="background:${palette[i]};"></span>
      <span class="num">${i}</span>-<span class="cnt">${counts[i]}</span>
    </span>`;
  }
  statsCompact.innerHTML = html;
  statsSummary.textContent = `Всего клеток: ${total} • Использовано оттенков: ${usedLevels} из ${LEVELS}`;
  statsPanel.style.display = 'block';

  // Печатная версия — просто строка "0-250 1-423 3-100 ..."
  let printLine = '';
  for (let i = 0; i < LEVELS; i++) {
    if (counts[i] === 0) continue;
    printLine += `${i}-${counts[i]}  `;
  }
  printStatsLine.textContent = printLine.trim();
}

// ===== ВИД =====
function applyView() {
  canvasStage.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.scale})`;
}

function resetView() {
  if (!canvas.width || !canvas.height) return;
  const cellPx = Math.max(16, cellSizeMm * 2);
  let startScale = 40 / cellPx;
  startScale = Math.max(0.2, Math.min(3, startScale));

  view.scale = startScale;
  view.tx = (canvasWrapper.clientWidth  - canvas.width  * startScale) / 2;
  view.ty = (canvasWrapper.clientHeight - canvas.height * startScale) / 2;
  applyView();
}

// ===== ЗУМ =====
canvasWrapper.addEventListener('wheel', (e) => {
  if (!currentMatrix) return;
  e.preventDefault();
  const rect = canvasWrapper.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const delta = e.deltaY < 0 ? 1.2 : 1 / 1.2;
  const newScale = Math.max(0.05, Math.min(40, view.scale * delta));
  const px = (mx - view.tx) / view.scale;
  const py = (my - view.ty) / view.scale;
  view.scale = newScale;
  view.tx = mx - px * newScale;
  view.ty = my - py * newScale;
  applyView();
}, { passive: false });

// ===== ПЕРЕТАСКИВАНИЕ =====
let isPanning = false;
let panStartX = 0, panStartY = 0, panStartTx = 0, panStartTy = 0;

canvasWrapper.addEventListener('mousedown', (e) => {
  if (!currentMatrix || e.button !== 0) return;
  isPanning = true;
  canvasWrapper.classList.add('panning');
  panStartX = e.clientX; panStartY = e.clientY;
  panStartTx = view.tx; panStartTy = view.ty;
  e.preventDefault();
});
window.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  view.tx = panStartTx + (e.clientX - panStartX);
  view.ty = panStartTy + (e.clientY - panStartY);
  applyView();
});
window.addEventListener('mouseup', () => {
  if (isPanning) { isPanning = false; canvasWrapper.classList.remove('panning'); }
});

// ===== СОХРАНЕНИЕ ПРОЕКТА =====
saveProjectBtn.addEventListener('click', () => {
  if (!currentMatrix) { statusMsg.textContent = '⚠️ Сначала загрузи фото'; return; }

  const project = {
    version: '1.0',
    app: 'РасКВАДРАсь',
    timestamp: new Date().toISOString(),
    settings: {
      cellSizeMm: cellSizeMm,
      levels: LEVELS,
      maxPixels: maxPixels,
      showTop: showTop.checked,
      showLeft: showLeft.checked,
      showDigits: showDigits.checked,
      stepTop: parseInt(stepTop.value) || 1,
      stepLeft: parseInt(stepLeft.value) || 1
    },
    width: currentWidth,
    height: currentHeight,
    matrix: currentMatrix
  };

  const json = JSON.stringify(project);
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `raskvadras_${currentWidth}x${currentHeight}_${LEVELS}ott_${cellSizeMm}mm.rkv`;
  a.click();
  URL.revokeObjectURL(a.href);
  statusMsg.textContent = `💾 Проект сохранён (${currentWidth}×${currentHeight}, ${LEVELS} оттенков)`;
});

// ===== ЗАГРУЗКА ПРОЕКТА =====
loadProjectBtn.addEventListener('click', () => projectInput.click());
projectInput.addEventListener('change', () => {
  if (projectInput.files.length) {
    loadProject(projectInput.files[0]);
    projectInput.value = '';
  }
});

function loadProject(file) {
  statusMsg.textContent = '⏳ Загрузка проекта...';
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const project = JSON.parse(e.target.result);
      if (!project.matrix || !project.width || !project.height) {
        throw new Error('Не тот формат');
      }

      currentMatrix = project.matrix;
      currentWidth = project.width;
      currentHeight = project.height;

      const s = project.settings || {};
      cellSizeMm = s.cellSizeMm || 10;
      LEVELS = s.levels || 10;
      maxPixels = s.maxPixels || 60;

      sizeSlider.value = cellSizeMm;
      sizeValue.textContent = cellSizeMm + ' мм';
      levelsInput.value = LEVELS;
      detailInput.value = maxPixels;
      levelsDisplay.textContent = LEVELS;
      detailDisplay.textContent = maxPixels;

      if (s.showTop !== undefined) showTop.checked = s.showTop;
      if (s.showLeft !== undefined) showLeft.checked = s.showLeft;
      if (s.showDigits !== undefined) showDigits.checked = s.showDigits;
      if (s.stepTop !== undefined) stepTop.value = s.stepTop;
      if (s.stepLeft !== undefined) stepLeft.value = s.stepLeft;

      redraw();
      resetView();
      updateStats();
      renderStats();

      statusMsg.textContent = `📂 Проект загружен: ${currentWidth}×${currentHeight}, ${LEVELS} оттенков, ${cellSizeMm} мм`;
    } catch (err) {
      statusMsg.textContent = '❌ Ошибка: файл повреждён или не подходит';
      console.error(err);
    }
  };
  reader.readAsText(file);
}

// ===== ПЕЧАТЬ =====
printBtn.addEventListener('click', () => {
  if (!currentMatrix) { statusMsg.textContent = '⚠️ Сначала загрузи фото'; return; }
  resetView();
  setTimeout(() => window.print(), 150);
});

// ===== ЭКСПОРТ .TXT =====
saveTxtBtn.addEventListener('click', () => {
  if (!currentMatrix) { statusMsg.textContent = '⚠️ Сначала загрузи фото'; return; }
  const text = currentMatrix.map(r => r.join(' ')).join('\n');
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `raskvadras_${currentWidth}x${currentHeight}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
  statusMsg.textContent = '📄 .txt сохранён';
});

// ===== ЭКСПОРТ .PNG =====
savePngBtn.addEventListener('click', () => {
  if (!currentMatrix) { statusMsg.textContent = '⚠️ Сначала загрузи фото'; return; }
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `raskvadras_${currentWidth}x${currentHeight}_${cellSizeMm}mm.png`;
    a.click();
    URL.revokeObjectURL(a.href);
    statusMsg.textContent = '🖼️ .png сохранён';
  }, 'image/png');
});

// ===== ОЧИСТКА =====
clearBtn.addEventListener('click', () => {
  currentMatrix = null; currentWidth = 0; currentHeight = 0; originalImage = null;
  canvas.width = 0; canvas.height = 0;
  sizeDisplay.textContent = '0×0';
  cellSizeDisplay.textContent = '10';
  totalSizeDisplay.textContent = '0 × 0 см';
  levelsDisplay.textContent = LEVELS;
  detailDisplay.textContent = maxPixels;
  statusMsg.textContent = '🧹 Очищено';
  fileInput.value = '';
  statsPanel.style.display = 'none';
  view = { scale: 1, tx: 0, ty: 0 };
  applyView();
});

window.addEventListener('resize', () => {
  if (currentMatrix) resetView();
});
</script>
