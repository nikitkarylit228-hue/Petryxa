<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixelizer Pro — мм + нумерация + печать</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; color:#eee; font-family:'Segoe UI',system-ui,sans-serif; padding:16px; }
  .app { max-width:1400px; margin:0 auto; background:#141414; border-radius:24px; padding:24px; border:1px solid #2a2a2a; }
  h1 { color:#00ff88; font-weight:600; font-size:24px; margin-bottom:16px; }
  h1 span { color:#444; font-weight:300; }
  .controls { display:flex; flex-wrap:wrap; gap:16px; align-items:center; background:#1a1a1a; padding:14px 18px; border-radius:16px; border:1px solid #2a2a2a; margin-bottom:20px; }
  .controls label { color:#aaa; font-size:13px; display:flex; align-items:center; gap:8px; }
  .controls input[type="number"] { width:80px; background:#0d0d0d; color:#00ff88; border:1px solid #333; border-radius:8px; padding:6px 10px; font-size:14px; }
  .controls input[type="range"] { width:180px; accent-color:#00ff88; }
  .controls .value { color:#00ff88; font-weight:bold; min-width:50px; }
  .upload-zone { border:2px dashed #2a2a2a; border-radius:20px; padding:30px; text-align:center; cursor:pointer; transition:0.3s; background:#0d0d0d; margin-bottom:20px; }
  .upload-zone:hover { border-color:#00ff88; background:#151515; }
  .upload-zone p { color:#888; font-size:16px; }
  .upload-zone small { color:#444; font-size:12px; }
  .upload-zone input { display:none; }
  .canvas-wrapper { background:#000; border-radius:20px; padding:16px; border:1px solid #222; overflow:auto; text-align:center; }
  #pixelCanvas { display:block; margin:0 auto; background:#fff; image-rendering:pixelated; max-width:100%; }
  .info-bar { display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; margin-top:16px; padding:12px 18px; background:#0d0d0d; border-radius:16px; border:1px solid #1e1e1e; }
  .stat { color:#666; font-size:13px; }
  .stat .val { color:#00ff88; font-weight:600; }
  .btn-group { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { background:#222; border:none; color:#ccc; padding:8px 18px; border-radius:12px; cursor:pointer; font-size:13px; font-weight:500; transition:0.2s; border:1px solid #2a2a2a; }
  .btn:hover { background:#00ff88; color:#0a0a0a; border-color:#00ff88; }
  .btn-danger { background:#331111; border-color:#441111; }
  .btn-danger:hover { background:#ff3333; color:#fff; }
  .btn-primary { background:#003322; border-color:#004433; }
  .btn-primary:hover { background:#00ff88; color:#0a0a0a; }
  .btn-print { background:#002244; border-color:#003366; }
  .btn-print:hover { background:#00aaff; color:#fff; border-color:#00aaff; }
  .status { color:#666; font-size:13px; text-align:center; margin-top:12px; padding:10px; background:#0d0d0d; border-radius:12px; }

  /* === ПЕЧАТЬ === */
  @media print {
    body { background:#fff; color:#000; padding:0; margin:0; }
    .app { background:#fff; border:none; padding:0; max-width:100%; border-radius:0; }
    .header, .controls, .upload-zone, .info-bar, .status { display:none !important; }
    .canvas-wrapper { background:#fff; border:none; padding:0; border-radius:0; overflow:visible; }
    #pixelCanvas { width:auto; height:auto; max-width:100%; page-break-inside:avoid; border-radius:0; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>◈ PIXELIZER <span>PRO — мм / нумерация / печать</span></h1>
  </div>

  <div class="controls">
    <label>📏 Размер пикселя (мм): 
      <input type="range" id="sizeSlider" min="1" max="50" step="1" value="10">
      <span class="value" id="sizeValue">10</span> мм
    </label>
    <label>🎨 Уровней серого: 
      <input type="number" id="levelsInput" min="2" max="32" value="10">
    </label>
  </div>

  <div class="upload-zone" id="uploadZone">
    <p>📁 Нажми или перетащи фото</p>
    <small>JPG, PNG, BMP, WEBP</small>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="canvas-wrapper" id="printArea">
    <canvas id="pixelCanvas"></canvas>
  </div>

  <div class="info-bar">
    <span class="stat">📐 <span class="val" id="sizeDisplay">0×0</span> пикселей</span>
    <span class="stat">📏 <span class="val" id="cellSizeDisplay">0</span> мм/пиксель</span>
    <span class="stat">📦 Итог: <span class="val" id="totalSizeDisplay">0 × 0 см</span></span>
    <span class="stat">🔢 <span class="val" id="cellDisplay">0</span> ячеек</span>
    <div class="btn-group">
      <button class="btn btn-print" id="printBtn">🖨️ Печать</button>
      <button class="btn btn-primary" id="saveBtn">💾 Скачать .txt</button>
      <button class="btn" id="copyBtn">📋 Копировать</button>
      <button class="btn btn-danger" id="clearBtn">✕ Очистить</button>
    </div>
  </div>

  <div class="status" id="statusMsg">⚡ Загрузи фото — настрой размер пикселя в мм</div>
</div>

<script>
const $ = id => document.getElementById(id);
const fileInput = $('fileInput'), uploadZone = $('uploadZone');
const canvas = $('pixelCanvas'), ctx = canvas.getContext('2d');
const sizeSlider = $('sizeSlider'), sizeValue = $('sizeValue');
const levelsInput = $('levelsInput');
const sizeDisplay = $('sizeDisplay'), cellSizeDisplay = $('cellSizeDisplay');
const totalSizeDisplay = $('totalSizeDisplay'), cellDisplay = $('cellDisplay');
const statusMsg = $('statusMsg');
const printBtn = $('printBtn'), saveBtn = $('saveBtn'), copyBtn = $('copyBtn'), clearBtn = $('clearBtn');

let currentMatrix = null, currentWidth = 0, currentHeight = 0;
let cellSizeMm = 10;
let LEVELS = 10;
const MAX_DISPLAY = 60;

sizeSlider.addEventListener('input', () => {
  cellSizeMm = parseFloat(sizeSlider.value);
  sizeValue.textContent = cellSizeMm;
  if (currentMatrix) redraw();
});

levelsInput.addEventListener('change', () => {
  LEVELS = Math.max(2, Math.min(32, parseInt(levelsInput.value) || 10));
  levelsInput.value = LEVELS;
  if (currentMatrix) statusMsg.textContent = '⚠️ Перезагрузите фото для смены уровней';
});

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.style.borderColor = '#00ff88'; });
uploadZone.addEventListener('dragleave', () => uploadZone.style.borderColor = '#2a2a2a');
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.style.borderColor = '#2a2a2a';
  if (e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; handleFile(e.dataTransfer.files[0]); }
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

function handleFile(file) {
  if (!file.type.startsWith('image/')) { statusMsg.textContent = '❌ Это не изображение'; return; }
  statusMsg.textContent = '⏳ Обработка...';
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => processImage(img);
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function processImage(img) {
  const w = img.width, h = img.height;
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = w; tempCanvas.height = h;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.drawImage(img, 0, 0);
  const imageData = tempCtx.getImageData(0, 0, w, h);
  const data = imageData.data;
  const step = 255 / (LEVELS - 1);
  const matrix = [];
  for (let y = 0; y < h; y++) {
    const row = [];
    for (let x = 0; x < w; x++) {
      const idx = (y * w + x) * 4;
      const gray = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
      let val = Math.round(gray / step);
      val = Math.min(Math.max(val, 0), LEVELS - 1);
      row.push(val);
    }
    matrix.push(row);
  }
  currentMatrix = matrix;
  currentWidth = w;
  currentHeight = h;
  redraw();
  updateStats();
  statusMsg.textContent = `✅ Готово: ${w}×${h} пикселей`;
}

function redraw() {
  if (!currentMatrix) return;
  drawPixelMatrix(currentMatrix, currentWidth, currentHeight);
}

function drawPixelMatrix(matrix, w, h) {
  let displayW = w, displayH = h;
  if (w > MAX_DISPLAY || h > MAX_DISPLAY) {
    const scale = Math.min(MAX_DISPLAY / w, MAX_DISPLAY / h);
    displayW = Math.floor(w * scale);
    displayH = Math.floor(h * scale);
  }

  const cellPx = 20;
  const paddingLeft = 40;
  const paddingTop = 40;
  const canvasW = paddingLeft + displayW * cellPx;
  const canvasH = paddingTop + displayH * cellPx;

  canvas.width = canvasW;
  canvas.height = canvasH;
  canvas.style.width = canvasW + 'px';
  canvas.style.height = canvasH + 'px';

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvasW, canvasH);

  const palette = [];
  for (let i = 0; i < LEVELS; i++) {
    const v = Math.round(i * (255 / (LEVELS - 1)));
    palette.push(`rgb(${v},${v},${v})`);
  }

  for (let y = 0; y < displayH; y++) {
    for (let x = 0; x < displayW; x++) {
      const srcX = Math.floor(x * w / displayW);
      const srcY = Math.floor(y * h / displayH);
      const val = matrix[srcY][srcX];
      const px = paddingLeft + x * cellPx;
      const py = paddingTop + y * cellPx;

      ctx.fillStyle = palette[val];
      ctx.fillRect(px, py, cellPx, cellPx);

      ctx.strokeStyle = '#cccccc';
      ctx.lineWidth = 1;
      ctx.strokeRect(px + 0.5, py + 0.5, cellPx - 1, cellPx - 1);

      const brightness = val * (255 / (LEVELS - 1));
      ctx.fillStyle = brightness < 128 ? '#ffffff' : '#000000';
      ctx.font = `bold ${Math.floor(cellPx * 0.6)}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(val, px + cellPx / 2, py + cellPx / 2);
    }
  }

  // Нумерация столбцов сверху
  ctx.fillStyle = '#000000';
  ctx.font = 'bold 12px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let x = 0; x < displayW; x++) {
    const px = paddingLeft + x * cellPx + cellPx / 2;
    ctx.fillText((x + 1).toString(), px, paddingTop / 2);
  }

  // Нумерация строк слева
  ctx.textAlign = 'right';
  for (let y = 0; y < displayH; y++) {
    const py = paddingTop + y * cellPx + cellPx / 2;
    ctx.fillText((y + 1).toString(), paddingLeft - 5, py);
  }

  // Рамка
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 2;
  ctx.strokeRect(paddingLeft, paddingTop, displayW * cellPx, displayH * cellPx);
}

function updateStats() {
  if (!currentMatrix) return;
  sizeDisplay.textContent = `${currentWidth}×${currentHeight}`;
  cellSizeDisplay.textContent = cellSizeMm;
  const totalW = (currentWidth * cellSizeMm / 10).toFixed(1);
  const totalH = (currentHeight * cellSizeMm / 10).toFixed(1);
  totalSizeDisplay.textContent = `${totalW} × ${totalH} см`;
  cellDisplay.textContent = (currentWidth * currentHeight).toLocaleString();
}

// === ПЕЧАТЬ ===
printBtn.addEventListener('click', () => {
  if (!currentMatrix) { statusMsg.textContent = '⚠️ Сначала загрузи фото'; return; }
  window.print();
});

saveBtn.addEventListener('click', () => {
  if (!currentMatrix) { statusMsg.textContent = '⚠️ Сначала загрузи фото'; return; }
  const text = currentMatrix.map(r => r.join(' ')).join('\n');
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `matrix_${currentWidth}x${currentHeight}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
});

copyBtn.addEventListener('click', () => {
  if (!currentMatrix) { statusMsg.textContent = '⚠️ Сначала загрузи фото'; return; }
  const text = currentMatrix.map(r => r.join(' ')).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    statusMsg.textContent = '📋 Матрица скопирована';
  }).catch(() => { statusMsg.textContent = '❌ Не удалось скопировать'; });
});

clearBtn.addEventListener('click', () => {
  currentMatrix = null; currentWidth = 0; currentHeight = 0;
  canvas.width = 0; canvas.height = 0;
  sizeDisplay.textContent = '0×0';
  cellSizeDisplay.textContent = '0';
  totalSizeDisplay.textContent = '0 × 0 см';
  cellDisplay.textContent = '0';
  statusMsg.textContent = '🧹 Очищено';
  fileInput.value = '';
});
</script>
</body>
</html>
