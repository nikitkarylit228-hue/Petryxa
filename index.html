<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixelizer Pro — финал</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; color:#eee; font-family:'Segoe UI',system-ui,sans-serif; padding:16px; }
  .app { max-width:1600px; margin:0 auto; background:#141414; border-radius:24px; padding:24px; border:1px solid #2a2a2a; }
  h1 { color:#00ff88; font-weight:600; font-size:24px; margin-bottom:16px; }
  h1 span { color:#444; font-weight:300; }
  .controls { display:flex; flex-wrap:wrap; gap:16px; align-items:center; background:#1a1a1a; padding:14px 18px; border-radius:16px; border:1px solid #2a2a2a; margin-bottom:12px; }
  .controls label { color:#aaa; font-size:13px; display:flex; align-items:center; gap:8px; }
  .controls input[type="number"] { width:80px; background:#0d0d0d; color:#00ff88; border:1px solid #333; border-radius:8px; padding:6px 10px; font-size:14px; }
  .controls input[type="range"] { width:220px; accent-color:#00ff88; }
  .controls input[type="checkbox"] { accent-color:#00ff88; width:16px; height:16px; }
  .controls .value { color:#00ff88; font-weight:bold; min-width:70px; font-size:15px; }
  .upload-zone { border:2px dashed #2a2a2a; border-radius:20px; padding:24px; text-align:center; cursor:pointer; transition:0.3s; background:#0d0d0d; margin-bottom:20px; }
  .upload-zone:hover { border-color:#00ff88; background:#151515; }
  .upload-zone p { color:#888; font-size:16px; }
  .upload-zone small { color:#444; font-size:12px; }
  .upload-zone input { display:none; }
  .canvas-wrapper { background:#0a0a0a; border-radius:20px; padding:16px; border:1px solid #222; overflow:auto; text-align:center; }
  #pixelCanvas { display:block; margin:0 auto; background:#fff; }
  .info-bar { display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; margin-top:16px; padding:12px 18px; background:#0d0d0d; border-radius:16px; border:1px solid #1e1e1e; }
  .stat { color:#666; font-size:13px; }
  .stat .val { color:#00ff88; font-weight:600; }
  .btn-group { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { background:#222; border:none; color:#ccc; padding:8px 18px; border-radius:12px; cursor:pointer; font-size:13px; font-weight:500; transition:0.2s; border:1px solid #2a2a2a; }
  .btn:hover { background:#00ff88; color:#0a0a0a; border-color:#00ff88; }
  .btn-danger { background:#331111; border-color:#441111; }
  .btn-danger:hover { background:#ff3333; color:#fff; }
  .btn-primary { background:#003322; border-color:#004433; }
  .btn-primary:hover { background:#00ff88; color:#0a0a0a; }
  .btn-print { background:#002244; border-color:#003366; }
  .btn-print:hover { background:#00aaff; color:#fff; border-color:#00aaff; }
  .status { color:#666; font-size:13px; text-align:center; margin-top:12px; padding:10px; background:#0d0d0d; border-radius:12px; }
  .section-title { color:#00ff88; font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; opacity:0.7; }
  @media print {
    body { background:#fff; color:#000; padding:0; margin:0; }
    .app { background:#fff; border:none; padding:0; max-width:100%; border-radius:0; }
    .header, .controls, .upload-zone, .info-bar, .status { display:none !important; }
    .canvas-wrapper { background:#fff; border:none; padding:0; border-radius:0; overflow:visible; }
    #pixelCanvas { width:auto; height:auto; max-width:100%; page-break-inside:avoid; border-radius:0; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>◈ PIXELIZER <span>PRO — финал</span></h1>
  </div>

  <div class="section-title">⚙️ Основные настройки</div>
  <div class="controls">
    <label>📏 Размер пикселя (мм): 
      <input type="range" id="sizeSlider" min="1" max="50" step="1" value="10">
      <span class="value" id="sizeValue">10 мм</span>
    </label>
    <label>🔍 Детализация: 
      <input type="number" id="detailInput" min="10" max="150" value="60">
    </label>
    <label>🎨 Уровней серого: 
      <input type="number" id="levelsInput" min="2" max="16" value="8">
    </label>
  </div>

  <div class="section-title">🔢 Нумерация</div>
  <div class="controls">
    <label>
      <input type="checkbox" id="showTop" checked> 
      Верхняя (столбцы)
    </label>
    <label>Шаг верх: 
      <input type="number" id="stepTop" min="1" max="50" value="1">
    </label>
    <label>
      <input type="checkbox" id="showLeft" checked> 
      Левая (строки)
    </label>
    <label>Шаг лево: 
      <input type="number" id="stepLeft" min="1" max="50" value="1">
    </label>
    <label>
      <input type="checkbox" id="showDigits" checked> 
      Цифры в ячейках
    </label>
  </div>

  <div class="upload-zone" id="uploadZone">
    <p>📁 Нажми или перетащи фото</p>
    <small>JPG, PNG, BMP, WEBP</small>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="canvas-wrapper" id="printArea">
    <canvas id="pixelCanvas"></canvas>
  </div>

  <div class="info-bar">
    <span class="stat">📐 Пикселей: <span class="val" id="sizeDisplay">0×0</span></span>
    <span class="stat">📏 1 пиксель = <span class="val" id="cellSizeDisplay">10</span> мм</span>
    <span class="stat">📦 Размер картины: <span class="val" id="totalSizeDisplay">0 × 0 см</span></span>
    <span class="stat">🔢 Ячеек: <span class="val" id="cellDisplay">0</span></span>
    <div class="btn-group">
      <button class="btn btn-print" id="printBtn">🖨️ Печать</button>
      <button class="btn btn-primary" id="saveBtn">💾 Скачать .txt</button>
      <button class="btn" id="copyBtn">📋 Копировать</button>
      <button class="btn btn-danger" id="clearBtn">✕ Очистить</button>
    </div>
  </div>

  <div class="status" id="statusMsg">⚡ Загрузи фото → настрой всё под себя</div>
</div>

<script>
const $ = id => document.getElementById(id);
const fileInput = $('fileInput'), uploadZone = $('uploadZone');
const canvas = $('pixelCanvas'), ctx = canvas.getContext('2d');
const sizeSlider = $('sizeSlider'), sizeValue = $('sizeValue');
const detailInput = $('detailInput'), levelsInput = $('levelsInput');
const showTop = $('showTop'), stepTop = $('stepTop');
const showLeft = $('showLeft'), stepLeft = $('stepLeft');
const showDigits = $('showDigits');
const sizeDisplay = $('sizeDisplay'), cellSizeDisplay = $('cellSizeDisplay');
const totalSizeDisplay = $('totalSizeDisplay'), cellDisplay = $('cellDisplay');
const statusMsg = $('statusMsg');
const printBtn = $('printBtn'), saveBtn = $('saveBtn'), copyBtn = $('copyBtn'), clearBtn = $('clearBtn');

let currentMatrix = null;
let currentWidth = 0, currentHeight = 0;
let cellSizeMm = 10;
let LEVELS = 8;
let maxPixels = 60;
let originalImage = null;

// ===== ОБРАБОТЧИКИ =====
sizeSlider.addEventListener('input', () => {
  cellSizeMm = parseFloat(sizeSlider.value);
  sizeValue.textContent = cellSizeMm + ' мм';
  if (currentMatrix) redraw();
});

detailInput.addEventListener('change', () => {
  maxPixels = Math.max(10, Math.min(150, parseInt(detailInput.value) || 60));
  detailInput.value = maxPixels;
  if (originalImage) processImage(originalImage);
});

levelsInput.addEventListener('change', () => {
  LEVELS = Math.max(2, Math.min(16, parseInt(levelsInput.value) || 8));
  levelsInput.value = LEVELS;
  if (originalImage) processImage(originalImage);
});

showTop.addEventListener('change', () => { if (currentMatrix) redraw(); });
showLeft.addEventListener('change', () => { if (currentMatrix) redraw(); });
showDigits.addEventListener('change', () => { if (currentMatrix) redraw(); });
stepTop.addEventListener('change', () => {
  stepTop.value = Math.max(1, Math.min(50, parseInt(stepTop.value) || 1));
  if (currentMatrix) redraw();
});
stepLeft.addEventListener('change', () => {
  stepLeft.value = Math.max(1, Math.min(50, parseInt(stepLeft.value) || 1));
  if (currentMatrix) redraw();
});

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.style.borderColor = '#00ff88'; });
uploadZone.addEventListener('dragleave', () => uploadZone.style.borderColor = '#2a2a2a');
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.style.borderColor = '#2a2a2a';
  if (e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; handleFile(e.dataTransfer.files[0]); }
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

function handleFile(file) {
  if (!file.type.startsWith('image/')) { statusMsg.textContent = '❌ Это не изображение'; return; }
  statusMsg.textContent = '⏳ Обработка...';
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => { originalImage = img; processImage(img); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function processImage(img) {
  const ratio = img.width / img.height;
  let w, h;
  if (img.width >= img.height) {
    w = maxPixels;
    h = Math.round(maxPixels / ratio);
  } else {
    h = maxPixels;
    w = Math.round(maxPixels * ratio);
  }

  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = w;
  tempCanvas.height = h;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.imageSmoothingEnabled = true;
  tempCtx.imageSmoothingQuality = 'high';
  tempCtx.drawImage(img, 0, 0, w, h);

  const imageData = tempCtx.getImageData(0, 0, w, h);
  const data = imageData.data;
  const step = 255 / (LEVELS - 1);
  const matrix = [];
  for (let y = 0; y < h; y++) {
    const row = [];
    for (let x = 0; x < w; x++) {
      const idx = (y * w + x) * 4;
      const gray = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
      let val = Math.round(gray / step);
      val = Math.min(Math.max(val, 0), LEVELS - 1);
      row.push(val);
    }
    matrix.push(row);
  }
  currentMatrix = matrix;
  currentWidth = w;
  currentHeight = h;
  redraw();
  updateStats();
  const totalW = (w * cellSizeMm / 10).toFixed(1);
  const totalH = (h * cellSizeMm / 10).toFixed(1);
  statusMsg.textContent = `✅ Готово: ${w}×${h} пикселей → картина ${totalW} × ${totalH} см`;
}

function redraw() {
  if (!currentMatrix) return;
  drawPixelMatrix(currentMatrix, currentWidth, currentHeight);
}

function drawPixelMatrix(matrix, w, h) {
  // ===== РАЗМЕР ЯЧЕЙКИ НА ЭКРАНЕ =====
  const cellPx = Math.max(10, Math.min(90, cellSizeMm * 2.5));
  const fontSize = Math.max(9, Math.floor(cellPx * 0.5));
  const topPad = showTop.checked ? Math.max(28, cellPx + 6) : 6;
  const leftPad = showLeft.checked ? Math.max(34, cellPx + 14) : 6;
  const rightPad = 6;
  const bottomPad = 6;

  const canvasW = leftPad + w * cellPx + rightPad;
  const canvasH = topPad + h * cellPx + bottomPad;

  canvas.width = canvasW;
  canvas.height = canvasH;
  canvas.style.width = canvasW + 'px';
  canvas.style.height = canvasH + 'px';

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvasW, canvasH);

  const palette = [];
  for (let i = 0; i < LEVELS; i++) {
    const v = Math.round(i * (255 / (LEVELS - 1)));
    palette.push(`rgb(${v},${v},${v})`);
  }

  // ===== ЯЧЕЙКИ =====
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const val = matrix[y][x];
      const px = leftPad + x * cellPx;
      const py = topPad + y * cellPx;

      ctx.fillStyle = palette[val];
      ctx.fillRect(px, py, cellPx, cellPx);

      ctx.strokeStyle = '#999999';
      ctx.lineWidth = 1;
      ctx.strokeRect(px + 0.5, py + 0.5, cellPx - 1, cellPx - 1);

      // Цифра в ячейке
      if (showDigits.checked && cellPx >= 16) {
        const brightness = val * (255 / (LEVELS - 1));
        ctx.fillStyle = brightness < 128 ? '#ffffff' : '#000000';
        ctx.font = `bold ${fontSize}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(val, px + cellPx / 2, py + cellPx / 2);
      }
    }
  }

  // ===== ВЕРХНЯЯ НУМЕРАЦИЯ =====
  if (showTop.checked) {
    const step = Math.max(1, parseInt(stepTop.value) || 1);
    const topFontSize = Math.max(9, Math.min(14, Math.floor(cellPx * 0.4)));
    ctx.fillStyle = '#000000';
    ctx.font = `bold ${topFontSize}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let x = 0; x < w; x++) {
      const num = x + 1;
      if (num % step !== 0 && num !== 1 && num !== w) continue;
      const px = leftPad + x * cellPx + cellPx / 2;
      ctx.fillText(num.toString(), px, topPad / 2);
    }
    // Верхняя линия
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(leftPad, topPad);
    ctx.lineTo(leftPad + w * cellPx, topPad);
    ctx.stroke();
  }

  // ===== ЛЕВАЯ НУМЕРАЦИЯ =====
  if (showLeft.checked) {
    const step = Math.max(1, parseInt(stepLeft.value) || 1);
    const leftFontSize = Math.max(9, Math.min(14, Math.floor(cellPx * 0.4)));
    ctx.fillStyle = '#000000';
    ctx.font = `bold ${leftFontSize}px Arial`;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let y = 0; y < h; y++) {
      const num = y + 1;
      if (num % step !== 0 && num !== 1 && num !== h) continue;
      const py = topPad + y * cellPx + cellPx / 2;
      ctx.fillText(num.toString(), leftPad - 6, py);
    }
    // Левая линия
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(leftPad, topPad);
    ctx.lineTo(leftPad, topPad + h * cellPx);
    ctx.stroke();
  }

  // ===== ВНЕШНЯЯ РАМКА =====
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 3;
  ctx.strokeRect(leftPad, topPad, w * cellPx, h * cellPx);
}

function updateStats() {
  if (!currentMatrix) return;
  sizeDisplay.textContent = `${currentWidth}×${currentHeight}`;
  cellSizeDisplay.textContent = cellSizeMm;
  const totalW = (currentWidth * cellSizeMm / 10).toFixed(1);
  const totalH = (currentHeight * cellSizeMm / 10).toFixed(1);
  totalSizeDisplay.textContent = `${totalW} × ${totalH} см`;
  cellDisplay.textContent = (currentWidth * currentHeight).toLocaleString();
}

printBtn.addEventListener('click', () => {
  if (!currentMatrix) { statusMsg.textContent = '⚠️ Сначала загрузи фото'; return; }
  window.print();
});

saveBtn.addEventListener('click', () => {
  if (!currentMatrix) { statusMsg.textContent = '⚠️ Сначала загрузи фото'; return; }
  const text = currentMatrix.map(r => r.join(' ')).join('\n');
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `matrix_${currentWidth}x${currentHeight}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
});

copyBtn.addEventListener('click', () => {
  if (!currentMatrix) { statusMsg.textContent = '⚠️ Сначала загрузи фото'; return; }
  const text = currentMatrix.map(r => r.join(' ')).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    statusMsg.textContent = '📋 Матрица скопирована';
  }).catch(() => { statusMsg.textContent = '❌ Не удалось скопировать'; });
});

clearBtn.addEventListener('click', () => {
  currentMatrix = null; currentWidth = 0; currentHeight = 0; originalImage = null;
  canvas.width = 0; canvas.height = 0;
  sizeDisplay.textContent = '0×0';
  cellSizeDisplay.textContent = '0';
  totalSizeDisplay.textContent = '0 × 0 см';
  cellDisplay.textContent = '0';
  statusMsg.textContent = '🧹 Очищено';
  fileInput.value = '';
});
</script>
</body>
</html>
